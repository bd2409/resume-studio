# Render blueprint: one Docker web service with a persistent disk for orders and files.
services:
  - type: web
    name: resume-studio
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: SITE_NAME
        value: Resume Studio
      - key: SITE_URL
        value: https://bhargabdas.in
      - key: CONTACT_EMAIL
        value: bhargabdas247@gmail.com
      - key: CONTACT_PHONE
        sync: false
      - key: BUSINESS_ADDRESS
        value: Gurugram, Haryana, India
      - key: OWNER_NAME
        value: Bhargab
      - key: PRICE_RUPEES
        value: "500"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CALL_BOOKING_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        value: production
      - key: DEV_SKIP_PAYMENT
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      # Or send through your own mailbox instead of Resend (GoDaddy email defaults: smtpout.secureserver.net:465).
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Set in the Render dashboard (must use a domain verified in Resend). sync: false stops
      # blueprint syncs from overwriting the value set there.
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
