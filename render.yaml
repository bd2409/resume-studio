# Render blueprint: one Docker web service with a persistent disk for orders and files.
services:
  - type: web
    name: resume-studio
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: SITE_NAME
        value: Resume Studio
      - key: SITE_URL
        value: https://bhargabdas.in
      - key: CONTACT_EMAIL
        value: bhargabdas247@gmail.com
      - key: CONTACT_PHONE
        sync: false
      - key: BUSINESS_ADDRESS
        value: Gurugram, Haryana, India
      - key: OWNER_NAME
        value: Bhargab
      - key: PRICE_RUPEES
        value: "500"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: DEV_SKIP_PAYMENT
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Resume Studio <orders@bhargabdas.in>
      - key: ADMIN_PASSWORD
        generateValue: true
